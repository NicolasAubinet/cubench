apply plugin: 'com.android.library'

android {
    defaultConfig {
        minSdkVersion 21
        compileSdkVersion 36

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.cube.nanotimer.services'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

// Only on the test classpath: the instrumented dependencies drag in the jdk7/jdk8 stdlib splits,
// whose classes kotlin-stdlib has carried itself since 1.8, and dexing rejects the duplicates.
configurations.matching { it.name.toLowerCase().contains('androidtest') }.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Not older: every runner before 1.6 reaches for android.test.suitebuilder, which Android 16
    // no longer ships, and the instrumentation dies before the first test rather than failing one.
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    implementation project(':datamodel')
}
