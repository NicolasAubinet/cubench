apply plugin: 'java-library'
apply plugin: 'maven-publish'

// A published contract, not a build number. The coach service must always run a coremodel at least
// as new as the newest app on Play, because old clients keep sending old schema_version payloads for
// years, so a breaking change here is a server-compatibility event rather than a refactor. Its version
// is the app release it ships in, so "at least as new as the newest app" is a version comparison.
group = 'com.cube.nanotimer'
version = project.property('cubenchVersion')

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The sources are UTF-8. Left to the platform, Windows reads them as cp1252 and a glossary word
// with an accent compiles to something else than on the Linux server build.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Android ships org.json in the platform and the coach service brings its own, so it is
    // compiled against here and never packaged.
    compileOnly 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}

publishing {
    publications {
        coremodel(MavenPublication) {
            from components.java
            pom {
                name = 'Cubench coremodel'
                description = 'The coach payload, plan and vocabulary shared by the Cubench app and the coach service.'
                url = 'https://github.com/NicolasAubinet/cubench'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                    }
                }
            }
        }
    }
    repositories {
        // GitHub Packages off the public repo, declared only when credentials are to hand so that a
        // bare `publish` cannot fire by accident.
        if (project.findProperty('githubPackagesUser') && project.findProperty('githubPackagesToken')) {
            maven {
                name = 'GitHubPackages'
                url = 'https://maven.pkg.github.com/NicolasAubinet/cubench'
                credentials {
                    username = project.property('githubPackagesUser')
                    password = project.property('githubPackagesToken')
                }
            }
        }
    }
}

// Published only from a commit tagged with this release, so it cannot go out under a version whose
// app is already on Play without it; mavenLocal rehearsals are left alone.
tasks.withType(PublishToMavenRepository).configureEach {
    def release = version.toString()
    doFirst {
        def tags = providers.exec { commandLine 'git', 'tag', '--points-at', 'HEAD' }
            .standardOutput.asText.get().readLines()*.trim()
        if (!tags.contains(release)) {
            throw new GradleException("coremodel ${release} publishes only from the commit tagged ${release}.")
        }
    }
}
