<!DOCTYPE html>
<!--
  Host page for NanoTimer's live cube: the connected smart cube, mirrored on screen as it is
  turned.

  Same arrangement as replay.html and scramble.html — loaded into a WebView through
  WebViewAssetLoader (https://appassets.androidplatform.net/..., NOT file://) and sharing the
  same vendored bundle.js.

  Java -> JS surface:
    ntLiveState(pattern)    the state the cube is in now, as a KTransformation's data (see
                            CubePatternFormat). Clears everything animated so far.
    ntLiveMove(notation)    one quarter turn, just made
    ntLiveGyro(on)          follow the cube's physical orientation, or keep it square
    ntLiveCamera(distance)  how far back the camera stands, so a cube in a big well can fill it
    ntLiveView(lat, lon)    where the camera stands while there is NO grip to follow, in degrees.
                            Ignored for as long as the gyro is followed, and applied again the
                            moment it is not: a mirror drawn from anywhere but square on is not a
                            mirror. A 90° step is turned rather than jumped.
    ntLiveStickering(mask)  which stickers keep their colour (see CubeStickering). A mask names
                            PIECES, not the slots they are in: Cube3D holds one object per piece
                            and moves it to wherever the piece sits, so the mask travels with the
                            piece. The two readings agree on a solved cube and nowhere else.

  WHY A STATE AND NOT A SETUP ALG.

  The player takes an alg, and an alg is a route: pointed at it, the mirror could only ever
  show a state somebody knew the moves to, so a cube scrambled before it was connected had
  nothing to show at all, and a missed move left the drawing wrong until the next solve. The
  setup ANCHOR also takes a KTransformation, which is the state itself and needs no route to
  it (AnchorTransformationProp returns setupTransformation outright when one is set, and
  currentPattern is that anchor with the animated alg applied over it). So the cube is seeded
  wherever it really is, and the turns since ride on top exactly as before.

  JS -> Java:
    NTBridge.onReady()      the cube is drawn
    NTBridge.orientation()  "w,x,y,z" — how the cube is held, in its own axes, or "" for no
                            reading. POLLED from the render loop, never pushed: the gyro runs
                            at ~20 Hz, faster than any consumer needs, and this is the idiom
                            SmartCube.getOrientation() is documented with.

  WHY THIS USES experimentalAddMove AND replay.html MUST NOT.

  The player animates an alg on its own clock at ~1000 ms per move, which is why the replay
  drives the timeline itself (see replay.html). Live wants the opposite thing, and the API
  gives it: experimentalAddMove sets the timeline to "end" and hands the move to the player's
  catch-up animator, so the state jumps to correct AT ONCE and only the newest turn is drawn
  turning. A burst of six turns therefore snaps to the state those six made and animates the
  sixth. A mirror must never fall behind the hands, and this is what stops it.

  The catch-up runs over catchUpMs / tempoScale, and catchUpMs is 500 inside the bundle, so
  tempoScale is how the turn duration is set.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  #host { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* The player draws the cube a few percent above the middle of its canvas — it is looked at from
     above, so the top face pushes the silhouette up. Measured at ~5% of the box on the phone. */
  twisty-player { width: 100%; height: 100%; --controls-height: 0; transform: translateY(5%); }
</style>
<script src="bundle.js"></script>
</head>
<body>
<div id="host"></div>
<script>
(function () {
  // The bundle's own catch-up length, which tempoScale divides. Not settable, so it is written
  // down here rather than read: tempoScale = CATCH_UP_MS / wanted turn.
  var CATCH_UP_MS = 500;
  // A turn is over this quickly, so the mirror is never seen lagging a fast solver.
  var DEFAULT_TURN_MS = 110;
  // Square on to the cube, so a cube held white-up green-front is drawn white-up green-front. The
  // player's own default is 30° round to the right, which reads as the cube sitting askew — and
  // the whole point of the anchor is that it should look square at the moment it is taken. Tilted
  // down far enough to see the top face, and no further.
  var CAMERA_LATITUDE = 26;
  var CAMERA_LONGITUDE = 0;
  // Where the camera stands unless the screen asks for something else. The timer's mirror is a
  // small box and wants this; a drill's well is most of the screen and wants closer.
  var DEFAULT_CAMERA_DISTANCE = 6;
  var cameraDistance = DEFAULT_CAMERA_DISTANCE;
  // Where it stands while there is no grip to follow, which a screen may ask to move (a cube with
  // no gyroscope reports nothing about how it is held, so the user turns the view by hand). Square
  // on until asked, and square on again whenever the gyro is followed.
  var viewLatitude = CAMERA_LATITUDE;
  var viewLongitude = CAMERA_LONGITUDE;
  // How long a quarter of that turn takes. Turned rather than jumped: a cube that snaps a quarter
  // turn has to be read again from nothing, where one that turns can be followed round.
  var VIEW_TURN_MS = 260;
  // The scene model is not always up the instant the player is appended, and until the camera has
  // been asked for the cube is drawn at the player's own default distance — a visibly larger cube,
  // held still, because the pose loop skips its nudge with no camera to nudge. Keep asking rather
  // than wait for the next seed to ask again, which is what used to shrink the cube mid-session.
  var CAMERA_RETRY_MS = 120;
  var CAMERA_TRIES = 25;

  var player = null;
  var readyNotified = false;

  function bridge(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (window.NTBridge && window.NTBridge[name]) {
      try { return window.NTBridge[name].apply(window.NTBridge, args); } catch (e) {}
    }
    return null;
  }

  function notifyReady() {
    if (!readyNotified) {
      readyNotified = true;
      bridge("onReady");
    }
  }

  // ---- the physical orientation ----------------------------------------------------------
  //
  // The same hook the replay uses (§4b / §6.7): the pose is written onto the three.js puzzle
  // object from experimentalCurrentThreeJSPuzzleObject's per-render callback, because the
  // player re-renders on its own schedule. Java hands over poses already in the cube's own
  // axes with its reference applied — nothing here knows what a gyro reference is.

  // How far the drawn pose closes on the reported one each frame. The gyro reports at ~20 Hz and
  // the screen draws at 60, so following the readings exactly means holding still for two frames
  // and jumping on the third — which is what "not very smooth" looks like. Closing a third of the
  // remaining angle per frame lands within a couple of degrees in ~4 frames, so the lag is well
  // under a tenth of a second and the motion is continuous.
  var POSE_FOLLOW = 0.34;

  var gyroOn = false;
  var puzzleObject = null;
  var poseHooked = false;
  var poseRaf = null;
  var target = [1, 0, 0, 0]; // the newest reading
  var pose = [1, 0, 0, 0];   // what is drawn, chasing it
  var lastApplied = null;

  /** q and -q are the same rotation, so take the short way round or the cube spins the long way. */
  function slerp(a, b, f) {
    var dot = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
    var sign = dot < 0 ? -1 : 1;
    dot = Math.abs(dot);
    var wa, wb;
    if (dot > 0.9995) {
      wa = 1 - f; // too close to interpolate by angle: lerp and renormalise
      wb = f;
    } else {
      var theta = Math.acos(dot);
      var sin = Math.sin(theta);
      wa = Math.sin((1 - f) * theta) / sin;
      wb = Math.sin(f * theta) / sin;
    }
    var out = [];
    var norm = 0;
    for (var k = 0; k < 4; k++) {
      out[k] = wa * a[k] + wb * sign * b[k];
      norm += out[k] * out[k];
    }
    norm = Math.sqrt(norm) || 1;
    for (var j = 0; j < 4; j++) {
      out[j] /= norm;
    }
    return out;
  }

  /** Whether the pose has moved. Only used before there is a puzzle object to ask instead. */
  function poseMoved() {
    return !lastApplied
        || Math.abs(pose[0] - lastApplied[0]) >= 1e-4 || Math.abs(pose[1] - lastApplied[1]) >= 1e-4
        || Math.abs(pose[2] - lastApplied[2]) >= 1e-4 || Math.abs(pose[3] - lastApplied[3]) >= 1e-4;
  }

  /**
   * Whether the scene is not already showing `pose`.
   *
   * ⚠️ Asks the object, never a record of what was last written to it. The player hands out a
   * fresh puzzle object whenever it rebuilds the cube, and a fresh one is square — so a
   * "has the pose changed since I wrote it" guard writes nothing to the new object for as long
   * as the hand holds still, and the cube snaps upright. Asking the scene cannot go stale, and
   * an identical write is still skipped, so this cannot start a render loop either.
   */
  function poseStale(object) {
    if (!object) {
      return false;
    }
    var q = object.quaternion;
    return Math.abs(q.w - pose[0]) >= 1e-4 || Math.abs(q.x - pose[1]) >= 1e-4
        || Math.abs(q.y - pose[2]) >= 1e-4 || Math.abs(q.z - pose[3]) >= 1e-4;
  }

  /** three.js orders a quaternion (x, y, z, w); ours are (w, x, y, z). */
  function applyPose(object) {
    if (!object) {
      return;
    }
    lastApplied = pose;
    if (poseStale(object)) {
      object.quaternion.set(pose[1], pose[2], pose[3], pose[0]);
    }
  }

  function hookPose() {
    if (poseHooked || !player || !player.experimentalCurrentThreeJSPuzzleObject) {
      return; // an older bundle without the hook: the cube simply stays square
    }
    poseHooked = true;
    try {
      // The per-render callback passes nothing — it is a "you are about to render" signal, and
      // the object comes from the promise (measured on the device, see replay.html).
      player.experimentalCurrentThreeJSPuzzleObject(function (object) {
        if (object) {
          puzzleObject = object;
        }
        applyPose(puzzleObject);
      }).then(function (object) {
        puzzleObject = object;
        applyPose(object);
      }).catch(function () {});
    } catch (e) {
      poseHooked = false;
    }
  }

  var nudge = 0;
  var orbit = null;
  var frames = 0;

  /**
   * ⚠️ The player renders only when something it owns changes, and standing still between
   * turns it owns nothing that does — so a pose written there would never be painted, and the
   * cube would sit frozen for exactly the seconds it is being turned over in the hands, which
   * is the one thing following the gyro is for.
   *
   * The camera is what forces it: `orbitCoordinates` has a listener that calls the renderer's
   * `scheduleRender`, so half a thousandth of a degree of longitude, alternating, is a render
   * a frame and is invisible. Deliberately NOT the timeline (which is what replay.html nudges):
   * a live cube's timeline is where the catch-up animation lives, and moving it under a turn in
   * flight would cut the turn short.
   */
  function poseLoop() {
    if (!gyroOn || !player) {
      poseRaf = null;
      return;
    }
    // ⚠️ The chain is re-armed in the finally, WHATEVER happens above. A throw in here used to end
    // the loop for good: the drawn pose froze at the last frame it managed, so the cube sat a
    // quarter turn from where the hands held it, no amount of moving it did anything (nothing was
    // reading the gyro any more), and only the next seed's ntLiveGyro(true) started it again —
    // which is exactly "a fast slice leaves it sideways until you re-solve". The nudge below is
    // the unguarded call that can do it: setCamera wraps the identical set() and this did not.
    try {
      poseStep();
    } catch (e) {
      console.error("live pose loop: " + e); // named, so the next one does not have to be guessed
    } finally {
      poseRaf = requestAnimationFrame(poseLoop);
    }
  }

  function poseStep() {
    // Every other frame: the gyro reports at ~20 Hz, so asking 60 times a second fetches the same
    // reading three times over — and every ask crosses into Java, which is the one thing in this
    // loop that is not free.
    frames++;
    if (frames % 2 === 0) {
      var reading = bridge("orientation");
      if (reading) {
        var parts = String(reading).split(",");
        if (parts.length === 4) {
          target = [+parts[0], +parts[1], +parts[2], +parts[3]];
        }
      }
    }
    pose = slerp(pose, target, POSE_FOLLOW);
    // ⚠️ Nudge whenever the scene is not showing the pose, and never merely because a turn is not
    // animating. Skipping it during moves was tried and is a trap: through a fast slice the moves
    // never stop arriving, so the nudge stays suppressed, the player renders only for its own
    // catch-up, and the pose written after that last render is never painted — the cube is left
    // showing an orientation from the middle of the turn. Asking the scene paints exactly when
    // there is something new to paint, which is also cheaper while the cube is held still, and
    // unlike "has the pose moved" it still fires for a puzzle object the player has just replaced.
    if (orbit && (puzzleObject ? poseStale(puzzleObject) : poseMoved())) {
      nudge = nudge ? 0 : 0.0005;
      player.experimentalModel.twistySceneModel.orbitCoordinatesRequest.set(
          { latitude: orbit.latitude, longitude: orbit.longitude + nudge, distance: orbit.distance });
    }
    applyPose(puzzleObject);
  }

  var cameraTries = 0;
  var viewRaf = null;

  /** Square on while the gyro is followed, and wherever the screen asked for while it is not. */
  function wantedLatitude() {
    return gyroOn ? CAMERA_LATITUDE : viewLatitude;
  }

  function wantedLongitude() {
    return gyroOn ? CAMERA_LONGITUDE : viewLongitude;
  }

  /** Where the camera is now, kept in `orbit` because the pose loop's nudge varies that. */
  function setOrbit(latitude, longitude) {
    orbit.latitude = latitude;
    orbit.longitude = longitude;
    try {
      // A fresh object, like the nudge's: the model is handed a value, not this one to hold on to.
      player.experimentalModel.twistySceneModel.orbitCoordinatesRequest.set(
          { latitude: latitude, longitude: longitude, distance: orbit.distance });
    } catch (e) {
      console.error("live view: " + e);
    }
  }

  /** Takes the camera to where it now belongs, turning it there unless asked to put it there. */
  function moveView(turn) {
    if (viewRaf) {
      cancelAnimationFrame(viewRaf);
      viewRaf = null;
    }
    if (!orbit) {
      return; // nothing to turn yet; setCamera starts from wherever the view stands by then
    }
    // The short way round, so a view going from 315° to 45° turns a quarter rather than three.
    var delta = ((wantedLongitude() - orbit.longitude) % 360 + 540) % 360 - 180;
    var fromLatitude = orbit.latitude;
    var fromLongitude = orbit.longitude;
    var toLatitude = wantedLatitude();
    if (Math.abs(delta) < 0.01 && Math.abs(toLatitude - fromLatitude) < 0.01) {
      return; // already there: every seed asks, and a turn of nothing still costs a frame each
    }
    if (!turn) {
      setOrbit(toLatitude, fromLongitude + delta);
      return;
    }
    var started = performance.now();
    var step = function () {
      var f = Math.min(1, (performance.now() - started) / VIEW_TURN_MS);
      var eased = f * f * (3 - 2 * f); // starts and stops softly, so it reads as one movement
      setOrbit(fromLatitude + (toLatitude - fromLatitude) * eased, fromLongitude + delta * eased);
      viewRaf = f < 1 ? requestAnimationFrame(step) : null;
    };
    viewRaf = requestAnimationFrame(step);
  }

  /** Points the camera at the cube, and keeps that as the base the nudge above varies. */
  function setCamera() {
    if (orbit || !player) {
      return;
    }
    var wanted =
        { latitude: wantedLatitude(), longitude: wantedLongitude(), distance: cameraDistance };
    try {
      player.experimentalModel.twistySceneModel.orbitCoordinatesRequest.set(wanted);
      orbit = wanted;
    } catch (e) {
      // Not necessarily an older bundle without the model — far more often one that has simply not
      // built it yet, a few frames after the element was appended. Ask again for a couple of
      // seconds before letting the default view stand.
      if (cameraTries++ < CAMERA_TRIES) {
        setTimeout(setCamera, CAMERA_RETRY_MS);
      }
    }
  }

  // Which state is the newest: the puzzle is fetched through a promise, so a state that arrives
  // while an older one is still waiting for it must not be overwritten when that one lands.
  var stateSeq = 0;

  function ensurePlayer() {
    if (!player) {
      player = document.createElement("twisty-player");
      player.puzzle = "3x3x3";
      player.visualization = "3D";
      player.background = "none";
      player.controlPanel = "none";
      player.hintFacelets = "none";
      player.tempoScale = CATCH_UP_MS / DEFAULT_TURN_MS;
      document.getElementById("host").appendChild(player);
    }
  }

  window.ntLiveState = function (pattern) {
    ensurePlayer();
    var seq = ++stateSeq;
    // Cleared here rather than after the await: a turn made in between belongs to the new state,
    // and clearing it late would throw that turn away.
    player.alg = "";
    var data;
    try {
      data = JSON.parse(pattern);
    } catch (e) {
      data = null;
    }
    if (data && window.NTCubing) {
      player.experimentalModel.kpuzzle.get().then(function (kpuzzle) {
        if (seq === stateSeq) {
          player.experimentalModel.setupTransformation.set(
              new window.NTCubing.KTransformation(kpuzzle, data));
        }
      }).catch(function (e) {
        console.error("live state: " + e);
      });
    }
    hookPose();
    setCamera();
    // Prefer signalling after a paint, but never depend on it: a WebView that is not drawing
    // starves requestAnimationFrame and the app would hold its spinner until the timeout.
    requestAnimationFrame(function () { requestAnimationFrame(notifyReady); });
    setTimeout(notifyReady, 300);
  };

  /**
   * How far back the camera stands. Applied to the orbit already in force as well as to the one
   * setCamera has yet to ask for: a screen that sets this after the cube is up must not be ignored,
   * and the pose loop's nudge reads its distance from the same object.
   */
  window.ntLiveCamera = function (distance) {
    cameraDistance = +distance || DEFAULT_CAMERA_DISTANCE;
    if (!orbit) {
      setCamera();
      return;
    }
    orbit.distance = cameraDistance;
    setOrbit(orbit.latitude, orbit.longitude);
  };

  /**
   * Where the camera stands while there is no grip to follow. A drill on a cube with no gyroscope
   * asks for a corner, and for a quarter more each time the user presses to turn it: nothing on
   * that cube says how it is being held, so the screen cannot follow it and the view is turned by
   * hand instead. Held while the gyro is followed and applied again the moment it is not.
   */
  window.ntLiveView = function (latitude, longitude) {
    viewLatitude = +latitude;
    viewLongitude = +longitude;
    if (!orbit) {
      setCamera(); // the first view, which is where the camera should open rather than turn to
      return;
    }
    moveView(true);
  };

  window.ntLiveMove = function (notation) {
    if (!player || !notation) {
      return;
    }
    try {
      player.experimentalAddMove(notation);
    } catch (e) {} // an unparseable move is not worth losing the mirror over
  };

  window.ntLiveStickering = function (mask) {
    ensurePlayer();
    try {
      player.experimentalStickeringMaskOrbits = JSON.parse(mask);
    } catch (e) {
      // Named rather than swallowed, and the cube is still drawn: a mask that will not parse costs
      // the drill its blindfold, where a throw here would cost it the cube.
      console.error("live stickering: " + e);
    }
  };

  window.ntLiveGyro = function (on) {
    gyroOn = !!on;
    hookPose();
    setCamera();
    // Square on the instant there is a grip, since the pose is about to swing to it anyway and a
    // camera still turning through that would be two movements at once. Turned back when it goes.
    moveView(!gyroOn);
    if (poseRaf) {
      cancelAnimationFrame(poseRaf);
      poseRaf = null;
    }
    if (gyroOn) {
      poseRaf = requestAnimationFrame(poseLoop);
    } else {
      target = [1, 0, 0, 0];
      pose = target;
      applyPose(puzzleObject); // back to square, and paint it
    }
  };
})();
</script>
</body>
</html>
