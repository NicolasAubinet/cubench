apply plugin: 'com.android.application'

// The coach service's address and token, kept out of the repository. A build without the address
// has no coach; one without the token asks by its Coach ID, which the service must hold a grant for.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// Both become string resources, where a leading @ or ? is a reference and a quote breaks the file.
['coach.url', 'coach.token'].each { key ->
    def value = localProperties.getProperty(key, '')
    if (!(value ==~ /[A-Za-z0-9._~:\/=+-]*/)) {
        throw new GradleException("local.properties: $key holds a character a string resource cannot carry")
    }
}

// A release carries the coach only while SmartCubeGate is on. A Play build turns the gate off on its
// release branch, so the token leaves with it: hidden screens would still leave it in the APK.
def gateMatch = file('src/main/java/com/cube/nanotimer/cube/SmartCubeGate.java').text =~
    /(?m)^\s*public static final boolean ENABLED = (true|false);/
if (!gateMatch.find()) {
    throw new GradleException("SmartCubeGate.java: no ENABLED line, and a release's coach token depends on it")
}
def releaseCoach = gateMatch.group(1) == 'true'
def releaseCoachUrl = releaseCoach ? localProperties.getProperty('coach.url', '') : ''
def releaseCoachToken = releaseCoach ? localProperties.getProperty('coach.token', '') : ''
// The Plan tab's test purchase buttons, which a release shows only when coach.purchase.debug=true:
// Play sells to the release package alone, so a debug build cannot try a purchase.
def releasePurchaseDebug = releaseCoach && localProperties.getProperty('coach.purchase.debug', '') == 'true'

// A bundle is only ever built for Play, where the token is one shared by every user: never carry it.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.path == ':nanotimer:bundleRelease' } && releaseCoachToken) {
        throw new GradleException("bundleRelease would carry the coach token: turn SmartCubeGate off, "
            + "as a Play build does, or take coach.token out of local.properties")
    }
    if (graph.allTasks.any { it.path == ':nanotimer:bundleRelease' } && releasePurchaseDebug) {
        throw new GradleException("bundleRelease would carry the test purchase buttons: take "
            + "coach.purchase.debug out of local.properties")
    }
}

// Release signing from local.properties; a password left out there is read from the environment,
// so deploy-phone.ps1 can ask for it instead of storing it.
def releaseStoreFile = localProperties.getProperty('release.storeFile', '')

android {
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile file(releaseStoreFile)
                storePassword localProperties.getProperty('release.storePassword') ?: System.getenv('CUBENCH_STORE_PASSWORD')
                keyAlias localProperties.getProperty('release.keyAlias')
                keyPassword localProperties.getProperty('release.keyPassword') ?: System.getenv('CUBENCH_KEY_PASSWORD')
            }
        }
    }
    defaultConfig {
        applicationId "com.cube.nanotimer"
        minSdkVersion 21
        compileSdkVersion 36
        targetSdkVersion 36
        versionCode 76
        versionName project.property('cubenchVersion')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            // Separate package so the debug build installs alongside the release app without
            // touching it or its data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue 'string', 'coach_url', localProperties.getProperty('coach.url', '')
            resValue 'string', 'coach_token', localProperties.getProperty('coach.token', '')
            resValue 'bool', 'coach_purchase_debug', 'true'
        }
        release {
            // The owner's own APK only, while the gate is on (see releaseCoach). Until each install
            // has its own identity (C2) a token here is one shared by every user who has the APK.
            resValue 'string', 'coach_url', releaseCoachUrl
            resValue 'string', 'coach_token', releaseCoachToken
            resValue 'bool', 'coach_purchase_debug', releasePurchaseDebug.toString()
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.cube.nanotimer'
    sourceSets {
        // The recorded blind solves are read from both modules' tests: the detectors name their
        // algorithms here, and the reconstruction spells them there.
        test.java.srcDirs += '../testfixtures/java'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.util.function, streams and the like exist only from API 24; minSdk is 21
        coreLibraryDesugaringEnabled true
    }
}

// CoachGlossaryStringsTest reads the translations from disk, so a strings-only change must rerun it.
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/main/res') { include 'values*/strings.xml' },
        fileTree('../datamodel/src/main/res') { include 'values*/strings.xml' })
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.webkit:webkit:1.12.1' // WebViewAssetLoader for the scramble diagram
    implementation 'com.google.android.play:review:2.0.2' // Play In-App Review API
    implementation 'androidx.work:work-runtime:2.10.5' // the weekly coach plan; 2.11 needs API 23
    implementation 'com.android.billingclient:billing:8.0.0' // 8.1 needs API 23

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013' // android.jar's org.json is a stub in unit tests

    implementation project(':datamodel')
    implementation project(':guilib')
    implementation project(':services')
    implementation project(':smartcube')
    
    implementation 'asia.ivity.android:drag-sort-listview:1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}
